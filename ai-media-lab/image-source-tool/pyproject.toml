[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-source-tool"
version = "0.1.0"
description = "Privacy-first, evidence-preserving anime and illustration source investigation"
requires-python = ">=3.10"
dependencies = ["Pillow>=11.0,<13"]

[project.scripts]
image-source = "image_source_tool.cli:main"

[tool.setuptools.packages.find]
include = ["image_source_tool*"]
